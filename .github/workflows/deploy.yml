name: Deploy BE

on:
  push:
    branches: [dev]
    paths: ['src/**', 'drizzle/**', 'package.json', 'package-lock.json', 'tsconfig.json', 'ecosystem.config.js']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

      - name: Sync source on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            export PATH="$PATH:$(npm config get prefix)/bin"
            cd /srv/POS/BE/be-elyra-pos
            git fetch origin dev
            git reset --hard origin/dev
            rm -rf dist

      - name: Copy dist to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/"
          target: "/srv/POS/BE/be-elyra-pos"
          overwrite: true

      - name: Install prod deps, migrate, reload
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            export PATH="$PATH:$(npm config get prefix)/bin"
            cd /srv/POS/BE/be-elyra-pos
            npm ci --omit=dev
            node dist/scripts/migrate-all-tenants.js || { echo 'Migration failed, deploy aborted'; exit 1; }
            pm2 reload pos-api --update-env
